appId: com.veto.app
---
# Only this flow clears Veto data. It never clears the fake wallet.
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Next: you set one rule"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: you set one rule"
- scrollUntilVisible:
    element: "Next: a refusal is saved"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: a refusal is saved"
- scrollUntilVisible:
    element: "Next: you decide"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: you decide"
# The step strip also renders CONNECT WALLET. Maestro text matching is
# case-insensitive, so the anchored regex matches the strip label too; with
# no index the tap resolves to the clickable button instead.
- scrollUntilVisible:
    element:
      text: "^Connect wallet$"
    direction: DOWN
- tapOn:
    text: "^Connect wallet$"
- extendedWaitUntil:
    visible: "AUTHORIZE"
    timeout: 30000
