appId: com.veto.app
---
# Before running, complete a rule-creating flow (04 or later) in its own
# invocation and generate a refusal for its newest rule from the laptop, as
# described in README.md. This flow replays only the introduction and
# authorization, never a rule approval: Decisions opens the wallet's newest
# live rule, and that must stay the refusal-bearing one.
- runFlow: helpers/reconnect.yaml
- tapOn: "Decisions"
# Reach the top first, then pull down through the list to trigger refresh.
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- extendedWaitUntil:
    visible: "Refused, recorded"
    timeout: 90000
# This is a row's accessibility text, not the Refused filter chip.
- assertVisible: "Refused, recorded"
- tapOn:
    text: "Refused, recorded"
    index: 0
- assertVisible: "No money moved."
