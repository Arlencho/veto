appId: com.veto.app
---
# Run right after a rule-creating flow (04 or later) and a refusal generated
# against its payment rule from the laptop, as described in README.md. The fake
# wallet creates a new account on every authorization, so reconnecting would
# land on an account with no rules. This flow keeps Veto's state and its
# connected account, and only relaunches onto the main tabs.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Decisions"
    timeout: 30000
- tapOn: "Decisions"
# Reach the top first, then pull down through the list to trigger refresh.
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- extendedWaitUntil:
    visible: "Refused, recorded"
    timeout: 90000
# This is a row's accessibility text, not the Refused filter chip.
- assertVisible: "Refused, recorded"
- tapOn:
    text: "Refused, recorded"
    index: 0
- assertVisible: "No money moved."
