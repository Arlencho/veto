appId: com.veto.app
---
# Before running, generate a refusal for the selected rule from the laptop.
# Start on a main tab with that rule selected, as described in README.md.
- tapOn: "Decisions"
# Reach the top first, then pull down through the list to trigger refresh.
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 600
- extendedWaitUntil:
    visible: "Refused, recorded"
    timeout: 90000
# This is a row's accessibility text, not the Refused filter chip.
- assertVisible: "Refused, recorded"
- tapOn:
    text: "Refused, recorded"
    index: 0
- assertVisible: "No money moved."
