appId: com.veto.app
---
# Replays first-run through the unsigned review, then stays there. The pasted
# agent stays on the review, so it is not typed again. Sets the payee through
# the payee scan's paste field, types the limits, and approves. The approve button only renders once a payee is set.
- runFlow: enter-agent.yaml
- scrollUntilVisible:
    element: "May only pay"
    direction: UP
    timeout: 20000
- tapOn: "(?-i)^Edit who your agent may pay.*"
# The payee scan keeps a paste field below its camera states (added in #351).
- assertVisible: "(?-i)^Use payee address$"
- tapOn: "(?-i)^Payee address$"
- inputText: "${PAYEE}"
- hideKeyboard
- tapOn: "(?-i)^Use payee address$"
# Back on the review screen with the payee staged from the scan handoff.
- extendedWaitUntil:
    visible: "Set your agent's limits"
    timeout: 20000
# Amount inputs are matched by their exact-cased accessibility labels. The
# upper-case section headings above them would also match without (?-i).
- scrollUntilVisible:
    element: "(?-i)^Most per payment$"
    direction: DOWN
    timeout: 20000
- tapOn: "(?-i)^Most per payment$"
- eraseText
- inputText: "0.1"
- hideKeyboard
- assertVisible: "0.1 USDC"
- tapOn: "(?-i)^Most in total, ever$"
- eraseText
- inputText: "1"
- hideKeyboard
# A drag that starts on a text input does not scroll this page, and Maestro's
# own scroll starts mid-screen, on an amount input. Swipe in the left margin,
# which holds no inputs.
- repeat:
    while:
      notVisible: "10 payments of 0.1 .* at most"
    times: 6
    commands:
      - swipe:
          start: 5%, 85%
          end: 5%, 40%
# The block summary below the dials proves the typed limits were applied.
- assertVisible: "The 1 .* total"
- assertVisible: "10 payments of 0.1 .* at most"
# Maestro counts rows that are drawn but still off-screen as visible, so a
# visibility loop can stop early. Swipe a fixed number of times instead; at
# the end of the page a swipe does nothing.
- repeat:
    times: 4
    commands:
      - swipe:
          start: 5%, 85%
          end: 5%, 40%
# The newest fake wallet account may still be receiving test funds. Until the
# wallet checks see the token, the app shows a receive prompt and the press
# does not open the wallet.
- extendedWaitUntil:
    notVisible: "You do not hold this token yet"
    timeout: 90000
- extendedWaitUntil:
    visible:
      text: "Press and hold to approve rule.*"
      enabled: true
    timeout: 60000
# Maestro longPressOn holds for 3 seconds.
- longPressOn: "Press and hold to approve rule.*"
- runFlow: fake-wallet-transaction.yaml
- extendedWaitUntil:
    visible: "Your rule is live."
    timeout: 90000
- extendedWaitUntil:
    visible: ".* can now ask to pay .* It can only ask. It cannot take."
    timeout: 60000
