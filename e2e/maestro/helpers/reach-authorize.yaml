appId: com.veto.app
---
# Entry point of every replay. Clearing Veto here is what makes each flow
# independently runnable: no flow relies on screen state left by a previous
# Maestro invocation. Only Veto data is cleared, never the fake wallet, whose
# test key survives as long as its process stays alive.
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Next: you set one rule"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: you set one rule"
- scrollUntilVisible:
    element: "Next: a refusal is saved"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: a refusal is saved"
- scrollUntilVisible:
    element: "Next: you decide"
    direction: DOWN
    timeout: 60000
- tapOn: "Next: you decide"
# The step strip also renders CONNECT WALLET. Maestro text matching is
# case-insensitive by default and picks the deepest matching element before
# filtering for clickability, so the strip's non-clickable Text would match
# first; the inline (?-i) flag limits the match to the button's exact case.
- scrollUntilVisible:
    element:
      text: "(?-i)^Connect wallet$"
    direction: DOWN
- tapOn:
    text: "(?-i)^Connect wallet$"
- extendedWaitUntil:
    visible: "AUTHORIZE"
    timeout: 30000
