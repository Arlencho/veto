appId: com.veto.app
---
# Flow 07 reads chain history written from the laptop, so it must not approve
# a new rule: a replayed approval would become the wallet's newest live rule,
# and Decisions would open it instead of the refusal-bearing one. Replay only
# the introduction and authorization, then relaunch onto the main tabs.
- runFlow: reach-authorize.yaml
- tapOn: "AUTHORIZE"
- extendedWaitUntil:
    visible: "Add your agent"
    timeout: 60000
- launchApp
- assertVisible: "Decisions"
